version: "3.9"

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  db:
    image: postgres:16-alpine
    container_name: ic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: interactive_course
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Ollama — Local LLM Server
  # ============================================
  ollama:
    image: ollama/ollama:latest
    container_name: ic-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU support (uncomment if NVIDIA GPU available)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ============================================
  # Ollama Model Puller — one-time setup
  # ============================================
  ollama-pull:
    image: curlimages/curl:latest
    container_name: ic-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    # Pull the model after Ollama is ready
    entrypoint: >
      sh -c "
        echo 'Pulling LLM model: ${LLM_MODEL_NAME:-llama3}...' &&
        curl -sf http://ollama:11434/api/pull -d '{\"name\": \"${LLM_MODEL_NAME:-llama3}\"}' &&
        echo 'Model pulled successfully!'
      "
    restart: "no"

  # ============================================
  # FastAPI Application
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ic-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/interactive_course
      LLM_MODEL: ${LLM_MODEL:-ollama/llama3}
      LLM_API_BASE: http://ollama:11434
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE: logs/app.log
    volumes:
      - app_logs:/app/logs
      - app_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================
  # Database Migrations (one-time)
  # ============================================
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ic-migrate
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/interactive_course
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Running database migrations...' &&
        alembic upgrade head &&
        echo 'Migrations complete!' &&
        echo 'Seeding mock data...' &&
        python -m mock_data.seed_db &&
        echo 'Seeding complete!'
      "
    restart: "no"

volumes:
  pg_data:
    driver: local
  ollama_data:
    driver: local
  app_logs:
    driver: local
  app_uploads:
    driver: local
